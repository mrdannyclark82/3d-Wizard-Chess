<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997b1a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Sanctum Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Ornament -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6, 8" opacity="0.6"/>

  <!-- Gothic King Crown / Piece Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Base Pedestal -->
    <path d="M140 395 L372 395 L356 360 L156 360 Z" fill="url(#goldGrad)"/>
    <rect x="126" y="395" width="260" height="20" rx="6" fill="url(#goldGrad)"/>

    <!-- Waist & Body -->
    <path d="M166 350 C180 300 190 260 198 215 L314 215 C322 260 332 300 346 350 Z" fill="url(#goldGrad)"/>
    
    <!-- Torus Ring -->
    <ellipse cx="256" cy="215" rx="64" ry="14" fill="url(#goldGrad)"/>

    <!-- Royal Gothic Crown Parapet -->
    <path d="M188 208 L170 125 L218 162 L256 100 L294 162 L342 125 L324 208 Z" fill="url(#goldGrad)"/>

    <!-- King Cross Peak -->
    <rect x="250" y="60" width="12" height="46" rx="2" fill="url(#goldGrad)"/>
    <rect x="238" y="74" width="36" height="12" rx="2" fill="url(#goldGrad)"/>
  </g>
</svg>
